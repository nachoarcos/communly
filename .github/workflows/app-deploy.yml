name: app-deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"

permissions:
  id-token: write
  contents: read

env:
  LAMBDA_CODE_BUCKET: ${{ vars.LAMBDA_CODE_BUCKET }}
  FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  deploy-lambdas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function:
          # 19 access patterns de app/lambdas + 2 stream consumers + 2
          # triggers de Cognito. function_name se declara explicito
          # (no se deriva de key) porque los triggers de Cognito no
          # siguen el mismo patron de nombres que el resto.
          - { key: get_user_profile, dir: app/lambdas/get_user_profile, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-get-user-profile" }
          - { key: get_own_profile, dir: app/lambdas/get_own_profile, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-get-own-profile" }
          - { key: list_posts, dir: app/lambdas/list_posts, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-list-posts" }
          - { key: get_post, dir: app/lambdas/get_post, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-get-post" }
          - { key: list_post_comments, dir: app/lambdas/list_post_comments, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-list-post-comments" }
          - { key: list_user_posts, dir: app/lambdas/list_user_posts, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-list-user-posts" }
          - { key: list_posts_by_tag, dir: app/lambdas/list_posts_by_tag, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-list-posts-by-tag" }
          - { key: list_user_feed, dir: app/lambdas/list_user_feed, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-list-user-feed" }
          - { key: list_user_notifications, dir: app/lambdas/list_user_notifications, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-list-user-notifications" }
          - { key: update_profile, dir: app/lambdas/update_profile, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-update-profile" }
          - { key: create_post, dir: app/lambdas/create_post, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-create-post" }
          - { key: update_post, dir: app/lambdas/update_post, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-update-post" }
          - { key: delete_post, dir: app/lambdas/delete_post, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-delete-post" }
          - { key: create_comment, dir: app/lambdas/create_comment, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-create-comment" }
          - { key: toggle_like, dir: app/lambdas/toggle_like, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-toggle-like" }
          - { key: toggle_follow, dir: app/lambdas/toggle_follow, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-toggle-follow" }
          - { key: request_image_upload, dir: app/lambdas/request_image_upload, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-request-image-upload" }
          - { key: report_post, dir: app/lambdas/report_post, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-report-post" }
          - { key: list_moderation_queue, dir: app/lambdas/list_moderation_queue, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-list-moderation-queue" }
          - { key: resolve_report, dir: app/lambdas/resolve_report, prefix: api, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-resolve-report" }
          - { key: fan-out, dir: app/stream-consumers/fan-out, prefix: stream-consumers, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-fan-out" }
          - { key: notifications, dir: app/stream-consumers/notifications, prefix: stream-consumers, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-notifications" }
          - { key: pre-signup, dir: app/cognito-triggers/pre-signup, prefix: cognito-triggers, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-cognito-pre-signup" }
          - { key: post-confirmation, dir: app/cognito-triggers/post-confirmation, prefix: cognito-triggers, function_name: "${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-cognito-post-confirmation" }
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar que el handler existe
        id: check
        run: |
          if [ -d "${{ matrix.function.dir }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ matrix.function.dir }} no existe todavia, se omite (placeholder de Terraform sigue activo para esta funcion)"
          fi

      - name: Empaquetar funcion (handler + shared + dependencias)
        if: steps.check.outputs.exists == 'true'
        run: |
          set -e
          BUILD_DIR=$(mktemp -d)
          cp -r "${{ matrix.function.dir }}"/* "$BUILD_DIR"/
          # shared/ vive fuera del directorio de cada funcion y solo lo
          # importan los handlers de app/lambdas (stream-consumers y
          # los triggers de Cognito son autocontenidos).
          case "${{ matrix.function.dir }}" in
            app/lambdas/*) cp -r app/lambdas/shared "$BUILD_DIR"/ ;;
          esac
          # boto3 viene incluido en el runtime; requirements.txt esta
          # vacio hoy, pero el paso queda listo para cuando deje de estarlo.
          pip install --quiet -r app/lambdas/requirements.txt --target "$BUILD_DIR"
          (cd "$BUILD_DIR" && zip -r "$OLDPWD/function.zip" . -x "*.git*" > /dev/null)

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.check.outputs.exists == 'true'
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Subir a S3
        if: steps.check.outputs.exists == 'true'
        run: |
          aws s3 cp function.zip \
            "s3://${{ env.LAMBDA_CODE_BUCKET }}/${{ matrix.function.prefix }}/${{ matrix.function.key }}.zip"

      - name: Actualizar codigo de la funcion Lambda
        if: steps.check.outputs.exists == 'true'
        run: |
          aws lambda update-function-code \
            --function-name "${{ matrix.function.function_name }}" \
            --s3-bucket "${{ env.LAMBDA_CODE_BUCKET }}" \
            --s3-key "${{ matrix.function.prefix }}/${{ matrix.function.key }}.zip" \
            --no-cli-pager

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-lambdas
    defaults:
      run:
        working-directory: app/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_COGNITO_DOMAIN: ${{ vars.COGNITO_HOSTED_UI_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          VITE_REDIRECT_URI: ${{ vars.FRONTEND_REDIRECT_URI }}
          VITE_LOGOUT_URI: ${{ vars.FRONTEND_LOGOUT_URI }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sincronizar build con S3
        run: |
          aws s3 sync ./dist "s3://${{ env.FRONTEND_BUCKET }}" --delete

      - name: Invalidar cache de CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
